<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 340" width="280" height="340" fill="none">
  <defs>
    <!-- 3D Brushed Metallic Gold Horizontal Gradient -->
    <linearGradient id="goldMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c430d" />
      <stop offset="18%" stop-color="#b88e3d" />
      <stop offset="38%" stop-color="#f7e1a0" />
      <stop offset="50%" stop-color="#fff4cc" />
      <stop offset="65%" stop-color="#d4af37" />
      <stop offset="85%" stop-color="#8b6914" />
      <stop offset="100%" stop-color="#4a3508" />
    </linearGradient>

    <!-- Dome Radial Metallic Shading -->
    <radialGradient id="domeGold" cx="42%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fff3c4" />
      <stop offset="26%" stop-color="#e5c16c" />
      <stop offset="58%" stop-color="#b38728" />
      <stop offset="84%" stop-color="#6e5010" />
      <stop offset="100%" stop-color="#3a2805" />
    </radialGradient>

    <!-- Inner Warm Lit Cavity -->
    <radialGradient id="innerCavity" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffdf5" />
      <stop offset="28%" stop-color="#ffe599" />
      <stop offset="62%" stop-color="#d49b35" />
      <stop offset="88%" stop-color="#6b470e" />
      <stop offset="100%" stop-color="#2b1b04" />
    </radialGradient>

    <!-- Ambient Bulb Halo -->
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#fff0b8" stop-opacity="0.92" />
      <stop offset="65%" stop-color="#c5a059" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="chainGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e5010" />
      <stop offset="50%" stop-color="#f7e1a0" />
      <stop offset="100%" stop-color="#5c430d" />
    </linearGradient>
  </defs>

  <!-- Ceiling Rose / Canopy -->
  <path d="M112 0 H168 C166 10 158 16 140 16 C122 16 114 10 112 0 Z" fill="url(#goldMetal)" />
  <rect x="131" y="15" width="18" height="6" rx="3" fill="url(#goldMetal)" />

  <!-- Suspension Chain Links -->
  <g stroke="url(#chainGold)" stroke-width="3.2" fill="none">
    <rect x="135" y="21" width="10" height="18" rx="5" />
    <line x1="140" y1="36" x2="140" y2="52" stroke-width="3.6" />
    <rect x="135" y="50" width="10" height="18" rx="5" />
    <line x1="140" y1="65" x2="140" y2="81" stroke-width="3.6" />
    <rect x="135" y="79" width="10" height="18" rx="5" />
    <line x1="140" y1="94" x2="140" y2="110" stroke-width="3.6" />
    <rect x="135" y="108" width="10" height="18" rx="5" />
    <line x1="140" y1="123" x2="140" y2="138" stroke-width="3.6" />
  </g>

  <!-- Ornate Crown Finial -->
  <circle cx="140" cy="143" r="7" fill="url(#goldMetal)" />
  <path d="M126 156 C126 149 132 146 140 146 C148 146 154 149 154 156 L160 164 H120 L126 156 Z" fill="url(#goldMetal)" />
  <rect x="114" y="164" width="52" height="6" rx="3" fill="url(#goldMetal)" />

  <!-- Upper Filigree Gallery Crown -->
  <path d="M104 178 C112 170 124 169 140 169 C156 169 168 170 176 178 L184 186 H96 L104 178 Z" fill="url(#goldMetal)" />

  <!-- Main Sculpted Royal Dome -->
  <path d="M40 264 C42 212 82 184 140 184 C198 184 238 212 240 264 Z" fill="url(#domeGold)" />

  <!-- Subtle Engraved Royal Ribs & Filigree Band on Dome -->
  <g stroke="#fff3c4" stroke-opacity="0.28" stroke-width="1.2" fill="none">
    <path d="M140 184 V262" />
    <path d="M140 184 C115 198 98 225 94 262" />
    <path d="M140 184 C165 198 182 225 186 262" />
    <path d="M140 184 C92 200 66 228 60 262" />
    <path d="M140 184 C188 200 214 228 220 262" />
  </g>

  <!-- Ornate Trim Band Around Lower Dome -->
  <rect x="34" y="260" width="212" height="9" rx="4.5" fill="url(#goldMetal)" />
  <rect x="28" y="268" width="224" height="5" rx="2.5" fill="#5c430d" />

  <!-- Inner Illuminated Underside Opening (Perspective Ellipse) -->
  <ellipse cx="140" cy="274" rx="108" ry="20" fill="url(#goldMetal)" />
  <ellipse cx="140" cy="275" rx="99" ry="16" fill="url(#innerCavity)" />

  <!-- Warm Glowing Bulb & Diffuser Halo (aligned with light cone at ~84%) -->
  <ellipse cx="140" cy="284" rx="68" ry="34" fill="url(#bulbGlow)" />
  <path d="M118 274 C120 292 160 292 162 274 Z" fill="#fffdf2" />
  <ellipse cx="140" cy="276" rx="22" ry="6" fill="#ffffff" />

  <!-- Delicate Crystal / Gold Hanging Drops Along Rim -->
  <g fill="url(#goldMetal)">
    <path d="M52 278 L55 286 L52 293 L49 286 Z" />
    <path d="M82 288 L85 297 L82 305 L79 297 Z" />
    <path d="M114 293 L117 303 L114 311 L111 303 Z" />
    <path d="M166 293 L169 303 L166 311 L163 303 Z" />
    <path d="M198 288 L201 297 L198 305 L195 297 Z" />
    <path d="M228 278 L231 286 L228 293 L225 286 Z" />
  </g>
</svg>
